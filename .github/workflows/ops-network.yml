name: Ops network extension
on:
  pull_request:
    paths: ['ops/**', 'tests/test_ops_network.py', '.github/workflows/ops-network.yml']
  push:
    branches: [main]
    paths: ['ops/**', 'tests/test_ops_network.py', '.github/workflows/ops-network.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7' 'mcp>=1.28,<2'
      - run: python ops/build_release.py --check
      - run: python -m unittest discover -s tests -p test_ops_network.py -v
      - run: python -m py_compile ops/network_engine.py ops/mcp_extension.py ops/install.py
