name: Ops network extension
on:
  pull_request:
    paths: ['ops/**', 'tests/test_ops*.py', '.github/workflows/ops-network.yml', 'patches/patch_qwenpaw_codex_client_health.py', 'tests/test_codex_client_health.py', 'tests/fixtures/codex_*.py', 'Dockerfile', 'tests/test_codex_client_image.py']
  push:
    branches: [main]
    paths: ['ops/**', 'tests/test_ops*.py', '.github/workflows/ops-network.yml', 'patches/patch_qwenpaw_codex_client_health.py', 'tests/test_codex_client_health.py', 'tests/fixtures/codex_*.py', 'Dockerfile', 'tests/test_codex_client_image.py']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        mcp: ['mcp==1.29.0', 'mcp==2.0.0', 'mcp==2.3.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7' '${{ matrix.mcp }}'
      - run: python ops/build_release.py --check
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile ops/network_engine.py ops/mcp_extension.py ops/install.py
  systemd-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: sudo env OPS_SYSTEMD_INTEGRATION=1 "$(command -v python)" tests/test_ops_systemd_integration.py -v
  client-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: OPS_CLIENT_IMAGE_TEST=1 python tests/test_codex_client_image.py -v
