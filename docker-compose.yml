services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        QWENPAW_IMAGE: ${QWENPAW_IMAGE:-docker.io/agentscope/qwenpaw:v2.1.0-beta.2}
        OPENAI_CODEX_VERSION: ${OPENAI_CODEX_VERSION:-0.144.4}
        HTTP_PROXY: ${JARVIS_HTTP_PROXY:-http://127.0.0.1:7890}
        HTTPS_PROXY: ${JARVIS_HTTPS_PROXY:-http://127.0.0.1:7890}
        ALL_PROXY: ${JARVIS_ALL_PROXY:-socks5h://127.0.0.1:7890}
        NO_PROXY: ${JARVIS_NO_PROXY:-127.0.0.1,localhost,::1,.dingtalk.com}
    image: ${JARVIS_IMAGE:-jarvis:qwenpaw-2.1-codex}
    container_name: jarvis
    init: true
    restart: unless-stopped
    # Host networking lets both the image build and Codex reach the existing
    # Mihomo proxy on 127.0.0.1:7890. The custom image forces QwenPaw itself
    # to bind only 127.0.0.1, so the console is not exposed publicly.
    network_mode: host
    environment:
      QWENPAW_WORKING_DIR: /app/working
      QWENPAW_SECRET_DIR: /app/working.secret
      QWENPAW_AUTH_ENABLED: "true"
      QWENPAW_AUTH_USERNAME: ${QWENPAW_AUTH_USERNAME:?set QWENPAW_AUTH_USERNAME in .env}
      QWENPAW_AUTH_PASSWORD: ${QWENPAW_AUTH_PASSWORD:?set QWENPAW_AUTH_PASSWORD in .env}
      QWENPAW_TOOL_GUARD_ENABLED: "true"
      QWENPAW_SKILL_SCAN_MODE: block
      QWENPAW_LOG_LEVEL: ${QWENPAW_LOG_LEVEL:-info}
      QWENPAW_PORT: ${JARVIS_PORT:-8088}
      CODEX_HOME: /root/.codex
      HTTP_PROXY: ${JARVIS_HTTP_PROXY:-http://127.0.0.1:7890}
      HTTPS_PROXY: ${JARVIS_HTTPS_PROXY:-http://127.0.0.1:7890}
      ALL_PROXY: ${JARVIS_ALL_PROXY:-socks5h://127.0.0.1:7890}
      NO_PROXY: ${JARVIS_NO_PROXY:-127.0.0.1,localhost,::1,.dingtalk.com}
      http_proxy: ${JARVIS_HTTP_PROXY:-http://127.0.0.1:7890}
      https_proxy: ${JARVIS_HTTPS_PROXY:-http://127.0.0.1:7890}
      all_proxy: ${JARVIS_ALL_PROXY:-socks5h://127.0.0.1:7890}
      no_proxy: ${JARVIS_NO_PROXY:-127.0.0.1,localhost,::1,.dingtalk.com}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./runtime/data:/app/working
      - ./runtime/secrets:/app/working.secret
      - ./runtime/backups:/app/working.backups
      - ./runtime/codex:/root/.codex
      - ./runtime/import-staging:/app/import-staging:ro
      - ./persona:/opt/jarvis/persona:ro
      - ./skills:/opt/jarvis/skills:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; port=os.environ.get('QWENPAW_PORT','8088'); urllib.request.urlopen(f'http://127.0.0.1:{port}/api/healthz', timeout=5)"
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
